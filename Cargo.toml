# Iteration profile. `opt-level = 1` keeps the binary fast to run while staying
# cheap to codegen. `debug = 1` (line tables only) is what a backtrace needs and
# is a fraction of full DWARF; dependencies drop debuginfo entirely because it
# is never read from here and it dominates both link time and `target/` size.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 1
debug = 1

[profile.test.package."*"]
debug = false

[package]
name = "mcc"
version = "0.9.0"
edition = "2021"
default-run = "mcc"

[lib]
name = "mcc"
path = "src/lib.rs"

[[bin]]
name = "mcc"
path = "src/main.rs"

[[bin]]
name = "mcviz"
path = "src/bin/mcviz.rs"

[[bin]]
name = "mcc-mcp"
path = "src/bin/mcp.rs"

[dependencies]
libc = "0.2"
dashmap = "6.1.0"
once_cell = "1.19"
rust-lapper = "1.1.0"
oxc_index = "0.36.0"
regex = "1.10"
dirs = "5.0"
line-index = "0.1.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1.0"
axum = "0.7"
hyper = "1.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
tar = "0.4"
flate2 = "1.0"
base64 = "0.22"
sysinfo = "0.32"
reqwest = { version = "0.12", features = ["json", "blocking"] }
bytes = "1.0"
rmcp = { version = "3.1.2", features = ["transport-io"] }

[dev-dependencies]
criterion = "0.5"
serde_json = "1.0"

[build-dependencies]
cc = "1.0"
