name: check-attr-keys

on:
  push:
  pull_request:

# The authoritative ledger table (doc/NAMING.md §8.3) and its mirror
# (ATTR_KEYS) both live in this checkout, so the scan runs for real on every
# push / pull request.
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile the ledger doc with ATTR_KEYS
        run: python3 scripts/check-attr-keys.py
