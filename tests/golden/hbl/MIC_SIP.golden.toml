# MIC_SIP golden 网表
# 依赖裁决：③ 转置 ' 不切网（C1 跨接 MIC.P/MIC.N 之间）
# 源码：periph.mc:38-64
# ★ 注意：golden 文档未包含 bias 网络（RES 240Ω, CAP 4.7uF, RES 1kΩ×4, CAP 1uF），
#   这些组件产生的网暂不在 golden 中登记。

[meta]
module = "MIC_SIP"
nets = 4
components = 7

[[comp]]
id = "mic"
class = "MICROPHONE.SIP2"
value = "SIP2-1.25MM-WA"
pins = 4
origin = "periph.mc:42"

[[comp]]
id = "C1"
class = "CAP"
value = "470pF"
pins = 2
origin = "periph.mc:50"

[[comp]]
id = "dio1"
class = "DIO.ESD"
value = "ESD9B5V-2/TR"
pins = 2
origin = "periph.mc:51"

[[comp]]
id = "dio2"
class = "DIO.ESD"
value = "ESD9B5V-2/TR"
pins = 2
origin = "periph.mc:51"

[[comp]]
id = "wm7121"
class = "MICROPHONE.WM7121P"
value = "WM7121P"
pins = 4
origin = "periph.mc:60"

[[comp]]
id = "C100n_nc"
class = "CAP"
value = "100nF"
pins = 2
origin = "periph.mc:61"

[[comp]]
id = "R0_nc"
class = "RES"
value = "0R"
pins = 2
origin = "periph.mc:63"

[[net]]
name = "MIC.P"
points = ["mic.1", "port.MIC.P", "C1.1", "dio1.1"]

[[net]]
name = "MIC.N"
points = ["mic.2", "port.MIC.N", "C1.2", "dio2.1", "R0_nc.1"]

[[net]]
name = "dc.GND"
points = ["dc.GND", "dio1.2", "dio2.2", "wm7121.2", "wm7121.3", "C100n_nc.2", "R0_nc.2"]

[[net]]
name = "wm7121.VCC"
points = ["dc.VDD_3V3", "wm7121.4", "C100n_nc.1"]

[[unconnected]]
pin = "mic.3"
reason = "MIC 外壳地 — 源码级缺陷，从未被连接（真 R09）"

[[unconnected]]
pin = "mic.4"
reason = "MIC 外壳地 — 源码级缺陷，从未被连接（真 R09）"

[[unconnected]]
