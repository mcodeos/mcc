# POWER_LDO golden netlist
# Dependency resolution: ⑥ global GND — ldo.2 doubles as VIN.GND and VOUT.GND, the first bridge of the global GND
# Source: power.mc:52-72
#
# Port member naming (module-internal view, netdiff normalized depth=1 form):
#   `in vin::DC(5V)`  → members VCC/GND (DC interface fallback names)
#   `out vout::DC(3.3V)` → members VCC/GND
# So the input rail is vin.VCC, the output rail is vout.VCC, and GND is the shared vin.GND/vout.GND net.
# In the parent module main, this port binds to the V5V/V3V3 nets, semantically corresponding to POWER_SYS/VCC (see main.golden).

[meta]
module = "POWER_LDO"
nets = 3
components = 3

[[comp]]
id = "ldo"
class = "LDO.SGM2019_33YN5G_TR"
value = "SGM2019-3.3YN5G/TR"
pins = 5
origin = "power.mc:59"

[[comp]]
id = "C10u"
class = "CAP"
value = "10uF"
pins = 2
origin = "power.mc:64"

[[comp]]
id = "C4u7"
class = "CAP"
value = "4.7uF"
pins = 2
origin = "power.mc:67"

[[net]]
name = "vin.VCC"
points = ["vin.VCC", "ldo.1", "ldo.3", "C10u.1"]

[[net]]
name = "GND"
points = ["vin.GND", "vout.GND", "ldo.2", "C10u.2", "C4u7.2"]

[[net]]
name = "vout.VCC"
points = ["vout.VCC", "ldo.5", "C4u7.1"]

[[unconnected]]
pin = "ldo.4"
reason = "SGM2019 fixed 3.3V output version, FB feedback pin unused"

[[series]]
comp = "C10u"
is_series = false

[[series]]
comp = "C4u7"
is_series = false