# POWER_USB golden 网表
# 依赖裁决：无（usbsock.GND = pin 6/7 由组件声明直接给出，无需裁决）
# 源码：power.mc:24-37
# ★ 与 golden 文档 v4 §1.1 差异：
#   - 文档写 TP3，源码 power.mc:34 声明为 TP3，以源码为准
#   - usbsock.5 在源码 power.mc:37 显式连接到 vin.GND，以源码为准

[meta]
module = "POWER_USB"
nets = 3
components = 4

[[comp]]
id = "usbsock"
class = "USB.MINI_B"
value = "HUM011D-5-S"
pins = 9
origin = "power.mc:28"

[[comp]]
id = "TP1"
class = "TEST_POINT"
value = ""
pins = 1
origin = "power.mc:29"

[[comp]]
id = "TP3"
class = "TEST_POINT"
value = ""
pins = 1
origin = "power.mc:29"

[[comp]]
id = "R0603"
class = "RES"
value = "0R"
pins = 2
origin = "power.mc:31"

[[net]]
name = "USB_VBUS"
points = ["usbsock.1", "TP1.1", "R0603.1"]

[[net]]
name = "vin.POWER_SYS"
points = ["R0603.2", "vin.POWER_SYS"]

[[net]]
name = "vin.GND"
points = ["usbsock.5", "usbsock.6", "usbsock.7", "usbsock.8", "usbsock.9", "TP3.1", "vin.GND"]

[[unconnected]]
pin = "usbsock.2"
reason = "USB D+，纯供电用途未使用"

[[unconnected]]
pin = "usbsock.3"
reason = "USB D-，纯供电用途未使用"

[[unconnected]]
pin = "usbsock.4"
reason = "USB ID，纯供电用途未使用"

[[series]]
comp = "R0603"
is_series = true