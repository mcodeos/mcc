# POWER_USB golden netlist
# Dependency resolution: none (usbsock.GND = pin 6/7 given directly by the component declaration; no resolution needed)
# Source: power.mc:24-37
# ★ Differences vs golden document v4 §1.1:
#   - The document writes TP3; the source power.mc:34 declares TP3; the source wins
#   - usbsock.5 is explicitly connected to vin.GND in the source power.mc:37; the source wins

[meta]
module = "POWER_USB"
nets = 3
components = 4

[[comp]]
id = "usbsock"
class = "USB.MINI_B"
value = "HUM011D-5-S"
pins = 9
origin = "power.mc:28"

[[comp]]
id = "TP1"
class = "TEST_POINT"
value = ""
pins = 1
origin = "power.mc:29"

[[comp]]
id = "TP3"
class = "TEST_POINT"
value = ""
pins = 1
origin = "power.mc:29"

[[comp]]
id = "R0603"
class = "RES"
value = "0R"
pins = 2
origin = "power.mc:31"

[[net]]
name = "USB_VBUS"
points = ["usbsock.1", "TP1.1", "R0603.1"]

[[net]]
name = "vin.POWER_SYS"
points = ["R0603.2", "vin.POWER_SYS"]

[[net]]
name = "vin.GND"
points = ["usbsock.5", "usbsock.6", "usbsock.7", "usbsock.8", "usbsock.9", "TP3.1", "vin.GND"]

[[unconnected]]
pin = "usbsock.2"
reason = "USB D+, unused (power-only usage)"

[[unconnected]]
pin = "usbsock.3"
reason = "USB D-, unused (power-only usage)"

[[unconnected]]
pin = "usbsock.4"
reason = "USB ID, unused (power-only usage)"

[[series]]
comp = "R0603"
is_series = true